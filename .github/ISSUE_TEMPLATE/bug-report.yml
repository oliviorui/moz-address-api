name: Bug report
description: Report a problem with the API or the project's tooling
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      description: The request or command, and its output.
      placeholder: GET /api/v1/search?q=...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or release, as shown by GET /

services:
  - type: web
    name: moz-address-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main

    # /health does not query the database. Using /health/ready here would keep a
    # Neon database awake around the clock and use up its free compute hours.
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        sync: false
      # Requests reach the API from a local proxy, so X-Forwarded-For does not
      # identify the client here. The header is set by the CDN in front of Render.
      - key: CLIENT_IP_HEADER
        value: true-client-ip
